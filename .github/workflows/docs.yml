name: Build and deploy Sphinx documentation

on:
  push:
    branches:
      - main

  workflow_dispatch:
    # Permet de déclencher manuellement le workflow depuis l'interface GitHub Actions.

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx shibuya sphinx-gallery Pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Sphinx documentation
        run: |
          cd doc
          make html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/build/html  # Corrected path
          publish_branch: gh-pages
          allow_empty_commit: false
          keep_files: false
          enable_jekyll: false
          exclude_assets: .github

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Note: Update actions to versions compatible with Node.js 24 before June 2026.
