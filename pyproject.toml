[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trainedml"
version = "0.1.3"
description = "Simple ML training framework"
authors = [
  { name = "diamankayero", email = "diamanka.tck@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "plotly",
    "tqdm",
    "requests",
    "pooch",
    "statsmodels",
    "joblib",
    "scipy"
]

[project.optional-dependencies]
dev = ["pytest", "streamlit"]
doc = ["sphinx", "sphinx_rtd_theme"]

[project.scripts]
trainedml = "trainedml.cli:main"

[project.urls]
Homepage = "https://github.com/diamankayero/trainedml"
Issues = "https://github.com/diamankayero/trainedml"