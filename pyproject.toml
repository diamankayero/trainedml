[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trainedml"
version = "0.3.0"
description = "Modular ML framework: train, benchmark, and visualize models with a unified API and CLI"
authors = [
  { name = "diamankayero", email = "diamanka.tck@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "plotly",
    "tqdm",
    "requests",
    "pooch",
    "statsmodels",
    "joblib",
    "scipy"
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
doc = ["sphinx", "shibuya", "sphinx-gallery", "Pillow"]

[project.scripts]
trainedml = "trainedml.cli:main"

[project.urls]
Homepage = "https://github.com/diamankayero/trainedml"
Issues = "https://github.com/diamankayero/trainedml"

[tool.mypy]
# No pinned python_version: mypy targets the interpreter's version,
# which stays consistent with the installed numpy stubs (PEP 695 on 3.12+).
files = ["src/trainedml"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true