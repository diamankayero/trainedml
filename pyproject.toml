[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trainedml"
version = "0.2.0"
description = "Modular ML framework: train, benchmark, and visualize models with a unified API and CLI"
authors = [
  { name = "diamankayero", email = "diamanka.tck@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "plotly",
    "tqdm",
    "requests",
    "pooch",
    "statsmodels",
    "joblib",
    "scipy"
]

[project.optional-dependencies]
web = ["fastapi", "uvicorn"]
dev = ["pytest", "ruff", "mypy", "fastapi", "uvicorn", "httpx"]
doc = ["sphinx", "sphinx_rtd_theme"]

[project.scripts]
trainedml = "trainedml.cli:main"

[project.urls]
Homepage = "https://github.com/diamankayero/trainedml"
Issues = "https://github.com/diamankayero/trainedml"

[tool.mypy]
# Pas de python_version épinglée : mypy cible la version de l'interpréteur,
# ce qui reste cohérent avec les stubs numpy installés (PEP 695 sur 3.12+).
files = ["src/trainedml"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Les modules de visualisation historiques ne sont pas encore annotés ;
# on vérifie seulement qu'ils s'importent proprement.
module = ["trainedml.viz.*", "trainedml.figure", "trainedml.analyzer", "trainedml.visualization"]
ignore_errors = true