# Déploiement Render (render.com) : détecté automatiquement à la création
# du Web Service, pré-remplit toute la configuration.
# Plan gratuit : le service s'endort après 15 min d'inactivité et met
# environ 30 s à se réveiller à la première visite.
services:
  - type: web
    name: trainedml-api
    runtime: python
    plan: free
    buildCommand: pip install -e ".[web]"
    startCommand: uvicorn webapp_api.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
